<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bad request — Reserved™</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f4f5f9; color: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    min-height: 100svh; padding: 32px 16px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 48px 40px;
    max-width: 480px; width: 100%; text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: #10264a; color: #fff;
    font-size: 28px; font-weight: 800; line-height: 56px;
    margin: 0 auto 24px;
  }
  .code { font-size: 72px; font-weight: 820; color: #10264a; line-height: 1; letter-spacing: -.04em; }
  h1 { font-size: 22px; font-weight: 700; margin: 12px 0 10px; }
  p { color: #666; font-size: 15px; line-height: 1.6; max-width: 340px; margin: 0 auto 28px; }
  a.btn {
    display: inline-block; padding: 12px 24px; border-radius: 999px;
    background: #10264a; color: #fff; font-weight: 700; font-size: 14px;
    text-decoration: none; transition: opacity .15s;
  }
  a.btn:hover { opacity: .85; }
  .secondary { margin-top: 14px; }
  .secondary a { color: #10264a; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">R</div>
  <div class="code">400</div>
  <h1>Bad request</h1>
  <p>Something about that request wasn't right. Check the form values and try again, or return to the Overview.</p>
  <a class="btn" href="/">Go to Overview</a>
  <div class="secondary"><a href="javascript:history.back()">← Go back</a></div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Founder access — Reserved</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f5f7;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e4e9;
            border-radius: 16px;
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0,0,0,.07);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .brand-mark {
            width: 36px; height: 36px;
            background: linear-gradient(145deg, #10264a, #315fae);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
        }
        .brand-name { font-weight: 750; font-size: 15px; color: #0e1c3a; }
        .brand-name small { display: block; font-size: 11px; font-weight: 500; color: #6b7280; margin-top: 1px; }
        h1 { font-size: 20px; font-weight: 800; color: #0e1c3a; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            color: #0e1c3a;
        }
        input[type="password"]:focus {
            border-color: #315fae;
            box-shadow: 0 0 0 3px rgba(49,95,174,.12);
        }
        .error-msg {
            margin-top: 10px;
            padding: 10px 13px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 12px;
            color: #b91c1c;
        }
        button[type="submit"] {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            background: #0e1c3a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s;
        }
        button[type="submit"]:hover { background: #1a2f5c; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-mark">R</div>
            <div class="brand-name">
                Reserved™
                <small>Founder access</small>
            </div>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">This area is restricted to the Reserved team.</p>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autofocus autocomplete="current-password" required
                   {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
            {% if error %}
            <p class="error-msg" id="login-error" role="alert">{{ error }}</p>
            {% endif %}
            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>

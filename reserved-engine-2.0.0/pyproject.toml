[project]
name = "reserved-engine"
version = "2.0.0"
description = "Reserved Tax Engine — standalone UK income tax, CGT, and allocation computation package"
requires-python = ">=3.11"
dependencies = []   # zero runtime dependencies; stdlib only (decimal, dataclasses, typing)

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "engine: pure-computation engine tests — no Flask, session, or database dependencies (run standalone with: pytest -m engine)",
]

[tool.ruff]
line-length = 100
